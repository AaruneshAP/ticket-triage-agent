[project]
name = "ticket-triage-agent"
version = "0.1.0"
description = "GitHub Issue Triage Agent reference implementation using ML, LLM, dbt, Databricks, and Power Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "streamlit>=1.32.0",
    "pydantic>=2.6.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]
ml = [
    "xgboost>=2.0.0",
    "lifelines>=0.28.0",
    "shap>=0.44.0",
    "sentence-transformers>=2.5.0",
    "mlflow>=2.11.0",
]
agent = [
    "langgraph>=0.0.30",
    "langfuse>=2.20.0",
    "google-generativeai>=0.4.0",
]
data = [
    "snowflake-connector-python[pandas]>=3.7.0",
    "dbt-snowflake>=1.7.0",
    "dbt-databricks>=1.7.0",
    "databricks-sql-connector>=3.0.0",
    "evidently==0.7.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib -m 'not integration'"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: marks slow integration tests requiring external live services or warehouse",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
